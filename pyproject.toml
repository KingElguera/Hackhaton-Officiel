[project]
name = "marcel"
version = "0.1.0"
description = "Marcel Pro : devis des artisans rénovateurs, prix relevés par des agents H Company, rendu 3D Blender"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",
    "fpdf2>=2.9.0",
    "hai-agents[cli]>=1.5.1",
    "huggingface-hub>=2.4.0",
    "pydantic>=2.14.3",
]

[project.scripts]
marcel = "marcel:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "uvicorn>=0.54.0",
]
outils = [
    "gradio-client>=2.7.2",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "trimesh>=5.2.1",
]
